name: Build Windows release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm.cmd run build
      - name: Build NSIS installer
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Verify installer exists
        id: installer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*-setup.exe" -File
          if (-not $files) { throw "NSIS installer was not generated." }
          $file = $files | Select-Object -First 1
          "path=$($file.FullName)" >> $env:GITHUB_OUTPUT
          Get-FileHash -Algorithm SHA256 $file.FullName
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME "${{ steps.installer.outputs.path }}" --generate-notes
